name: Nexus CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Code Formatting & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Rust format & Clippy
        run: |
          cd core-rs
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Go format check
        run: |
          test -z "$(gofmt -l worker/ bench/)"

  test-rust:
    name: Rust Computational Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core-rs
      - name: Run Rust Tests
        run: |
          cd core-rs
          cargo test --verbose

  test-go:
    name: Go Engine & Race Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Staticlib & Run Go Tests with Race Detector
        run: |
          cd core-rs && cargo build --release && cd ..
          cd worker && CGO_ENABLED=1 go test -race -v ./...

  test-python:
    name: FastAPI Gateway Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies & pytest
        run: |
          cd api
          pip install -r requirements.txt
          NEXUS_AUTH_TOKEN=nexus-ci-dummy-token-verification PYTHONPATH=. pytest -v tests/

  docker-build:
    name: Docker Multi-Stage Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build All Docker Compose Services
        run: |
          cp .env.example .env
          docker compose build
