services:
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5

  nexus-api:
    build:
      context: ./api
    container_name: nexus-api
    ports:
      - "8085:8000"
    environment:
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
      - NEXUS_AUTH_TOKEN=${NEXUS_AUTH_TOKEN:?Set NEXUS_AUTH_TOKEN in .env}
    depends_on:
      nexus-redis:
        condition: service_healthy

  nexus-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: nexus-worker
    environment:
      - REDIS_HOST=nexus-redis
      - REDIS_PORT=6379
    depends_on:
      nexus-redis:
        condition: service_healthy
